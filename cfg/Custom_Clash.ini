;Custom_OpenClash_Rules（合并优化版）
;主体沿用你自己的 MAXLYEN 风格自定义规则列表（命名格式、分组风格、规则来源完全保留）
;标记 "🆕" 的行是本次从 Aethersailor/Custom_OpenClash_Rules 模板中借鉴的 GeoSite/GeoIP 补充规则
;所有 custom_proxy_group 一律沿用你的命名与书写格式（英文分组名 + emoji 国旗节点名 + 你的候选顺序），包括本次新增的分组
;金融/虚拟货币类：你的 .list 一律排在前面优先命中，GEOSITE 只作为其后的兜底，绝不会抢走 list 已覆盖的域名
;
;【规则源分两档，改动 list 后请注意生效时间的差异】
; ① raw + 3600（12 条）：
;    金融/虚拟货币 —— OKX / SG / Binance / Bybit / PayPal
;    AI 平台     —— OpenAI / Copilot / Claude / Nvidia / Gemini
;    私人定制     —— Custom_Direct / Custom_Proxy
;    这几类要么私密要么变动频繁（AI 平台域名和风控端点更新很快），raw 无缓存，最长 1 小时生效
; ② jsdelivr + 28800（76 条）：其余全部公共规则
;    jsdelivr 在国内可达性远好于 raw.githubusercontent.com，8 小时拉一次，显著降低软路由负担
;    代价：jsdelivr 对 @main 分支引用有 CDN 缓存，改完 list 后生效可能延迟数小时
;    如需强制刷新某个文件，可访问 https://purge.jsdelivr.net/gh/MAXLYEN/Openclash-Rule@main/rules/文件名.list
;
;【分组归属规范】每条 ruleset 的分组按以下优先级判定：
; ① 文件名与分组名存在对应/包含关系 → 用该专属分组
;    OpenAI.list→ChatGPT，Copilot.list→Copilot，Netflix.list→Netflix，Amazon.list→Shopping Platform …
; ② 无对应关系，只是共用同一地区节点 → 归到该地区的公共分组，不再挂靠无关的专属分组
;    美国→Optional，日本→Emby，新加坡→Google，香港→Asia，欧洲→EUNet，英国→UKNet
;    澳洲→Oceania，南美→South America，冷门地区→UnpopularNet
; 本次据此调整了 5 条（Claude / Nvidia / GoogleVoice / GoogleCNProxyIP / GEOSITE,category-ai-!cn）
;
;规则从上到下遍历，命中即止；新增内容已插入到语义上最合理的位置，不改变原有规则之间的相对顺序

