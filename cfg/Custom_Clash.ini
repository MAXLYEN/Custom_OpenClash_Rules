;🆕 本次已重写下方 8 个启用中的节点正则，核心改动：字母缩写一律加词边界 \b 并允许跟编号，写作 \bXX[-_ ]?\d*\b
;   原因见下（原写法会误抓节点）：AU→AUTO、GB→100GB/50GB、新→新北/新西兰、DE/GE→SWEDEN 等
;   新写法可正常匹配 AU / AU1 / AU-01 / AU_02 / "AU 03"，但不会再匹配 AUTO
;⚠️ 内核用的是 Go RE2 引擎，不支持 (?!...) 先行断言和 (?<!...) 后行断言
;   左边那份模板里的 "🌐 其他地区" 和 (?<!尼|-)日 等写法依赖这两种语法，抄过来会导致正则编译失败、分组为空
;   下方所有正则均为 RE2 兼容写法，注释掉的备用地区分组沿用你的原始写法未动，启用前建议按同样方式加 \b
